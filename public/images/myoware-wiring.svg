<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 280" role="img" aria-labelledby="title desc">
  <title id="title">MyoWare 2.0 wiring to Elegoo Uno R3</title>
  <desc id="desc">VIN to 5V, GND to GND, ENV to A0. Power switch ON.</desc>
  <rect width="640" height="280" rx="24" fill="#f7fbfe"/>
  <rect x="28" y="36" width="210" height="208" rx="18" fill="#1b3348"/>
  <text x="133" y="78" text-anchor="middle" fill="#e8f3fb" font-family="system-ui,sans-serif" font-size="16" font-weight="700">MyoWare 2.0</text>
  <text x="133" y="102" text-anchor="middle" fill="#8ec5e8" font-family="system-ui,sans-serif" font-size="12">muscle sensor</text>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#e8f3fb">
    <text x="48" y="140">VIN</text>
    <text x="48" y="168">GND</text>
    <text x="48" y="196">ENV</text>
    <text x="48" y="224">Power switch ON</text>
  </g>
  <rect x="402" y="36" width="210" height="208" rx="18" fill="#ffffff" stroke="#b7d4e8"/>
  <text x="507" y="78" text-anchor="middle" fill="#1b3348" font-family="system-ui,sans-serif" font-size="16" font-weight="700">Elegoo Uno R3</text>
  <text x="507" y="102" text-anchor="middle" fill="#4d6478" font-family="system-ui,sans-serif" font-size="12">three wires only</text>
  <g font-family="system-ui,sans-serif" font-size="13" fill="#1b3348">
    <text x="424" y="140">5V</text>
    <text x="424" y="168">GND</text>
    <text x="424" y="196">A0</text>
    <text x="424" y="224">VIN LED stays on</text>
  </g>
  <path d="M238 136 H402" stroke="#9a4f4f" stroke-width="3"/>
  <path d="M238 164 H402" stroke="#1b3348" stroke-width="3"/>
  <path d="M238 192 H402" stroke="#3a7d62" stroke-width="3"/>
</svg>
